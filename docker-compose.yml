services:
  postgres:
    image: postgres:16
    container_name: spreadsheet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spreadsheet
      POSTGRES_PASSWORD: spreadsheet_dev
      POSTGRES_DB: spreadsheet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: spreadsheet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
